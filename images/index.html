<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="profile-card">
        <div class="profile-header">
            <img class="profile-photo" src="กูแดง.jpg" alt="รูปโปรไฟล์">
            <h1>My Profile</h1>
        </div>

        <p>ชื่อ นามสกุล: <span id="fullname">กิตติกวิน อาชีวระงับโรค</span></p>
        <p>ชื่อเล่น: <span id="nicname">ยูโร</span></p>
        <p>รหัสประจำตัว: <span id="studentID">68219010002</span></p>

        <div class="motto">
            <h2>คติประจำใจ</h2>
            <p id="motto">อบต ย่อมาจากอาบาตตาคัม</p>
        </div>

        <button id="greetingBtn" type="button">e wave</button>
        <p id="greetingMessage" aria-live="polite">กดปุ่มเพื่อแสดงคำทักทาย</p>
    </main>
</body>
</html>
